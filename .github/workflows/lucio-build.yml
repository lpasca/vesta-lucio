name: Vesta L build

# Fork-only (lpasca/vesta-lucio). Builds the side-by-side "Vesta L" Android APK, signed with the
# fork's own key (repo secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS),
# and the unsigned Windows installer. A pushed lucio-v* tag publishes both to a GitHub release, which
# is also where the desktop app's updater looks.

on:
  workflow_dispatch:
  push:
    tags: ["lucio-v*"]

permissions:
  contents: write

concurrency:
  group: lucio-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-lucio-${{ runner.os }}-${{ hashFiles('apps/package-lock.json') }}
          restore-keys: gradle-lucio-${{ runner.os }}-

      - name: Size the gradle daemon for the runner
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m\n' >> ~/.gradle/gradle.properties

      - name: Install app deps
        run: npm --prefix apps ci

      - name: Prebuild + assemble release
        working-directory: apps/mobile
        env:
          VESTA_APP_VARIANT: production
          CI: "1"
        run: |
          npx expo prebuild --clean --platform android
          cd android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Sign with the fork key
        working-directory: apps/mobile
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          unsigned=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p build
          "$tools/zipalign" -f -p 4 "$unsigned" build/aligned.apk
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" \
            --out build/VestaL-android.apk build/aligned.apk
          "$tools/apksigner" verify --print-certs build/VestaL-android.apk | head -3
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v7
        with:
          name: VestaL-android
          path: apps/mobile/build/VestaL-android.apk

  windows:
    name: Windows installer (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/package-lock.json

      - name: Install app deps
        run: npm --prefix apps ci

      - name: Build web bundle + Electron app
        shell: bash
        run: |
          npm --prefix apps -w @vesta/web run build
          cd apps/desktop
          npm run compile
          npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: VestaL-windows
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/lucio-v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" \
            --title "Vesta L ${GITHUB_REF_NAME#lucio-v}" --notes "Fork build of Vesta (lpasca/vesta-lucio)."
